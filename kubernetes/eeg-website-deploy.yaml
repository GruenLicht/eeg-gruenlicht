apiVersion: apps/v1
kind: Deployment
metadata:
  name: eeg-website
  namespace: eeg-gruenlicht
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eeg-website
  template:
    metadata:
      name: eeg-website
      labels:
        app: eeg-website
    spec:
      containers:
      - name: eeg-website
        image: oydeu/eeg-gruenlicht:261108-2
        ports:
        - containerPort: 3000
        env:
          - name: LANG
            value: C.UTF-8
          - name: RAILS_LOG_TO_STDOUT
            value: "TRUE"
          - name: RAILS_SERVE_STATIC_FILES
            value: "TRUE"
          - name: RAILS_ENV
            value: production
          - name: RAILS_CONFIG_HOSTS
            value: "eeg-gruenlicht.at"
          - name: BLOG_LISTED
            value: "1"

          - name: NO_REPLY_EMAIL
            value: 'no-reply@eeg-gruenlicht.at'
          - name: SMTP_USERNAME
            value: 'REDACTED'
          - name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: eeg-website-smtp
                key: password
          - name: SMTP_SECURITY
            value: ssl
          - name: SMTP_ADDRESS
            value: 'REDACTED'
          - name: SMTP_PORT
            value: '465'
          - name: SMTP_DOMAIN
            value: 'eeg-gruenlicht.at'
          # Kanonischer Host -- Mail-Links sollen nicht ueber einen Redirect laufen.
          - name: MAILER_URL_OPTIONS_HOST
            value: 'eeg-gruenlicht.at'
          - name: SECRET_KEY_BASE
            valueFrom:
              secretKeyRef:
                name: eeg-website-skb
                key: SECRET_KEY_BASE
---
kind: Service
apiVersion: v1
metadata:
  name: eeg-website
  namespace: eeg-gruenlicht
spec:
  selector:
    app: eeg-website
  type: NodePort
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
---
# Alle vier Hostnamen liefern die Anwendung aus.
# Die Umleitung der Nebenformen auf den Apex passiert NICHT hier -- der
# nginx-Admission-Webhook lehnt "permanent-redirect" mit $request_uri ab.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eeg-website
  namespace: eeg-gruenlicht
  annotations:
    certmanager.io/issuer: "letsencrypt-prod"
spec:
  ingressClassName: "nginx"
  tls:
  - hosts:
    - eeg-gruenlicht.at
    - www.eeg-gruenlicht.at
    - xn--eeg-grnlicht-ilb.at
    - www.xn--eeg-grnlicht-ilb.at
    secretName: eeg-website-tls
  rules:
  - host: eeg-gruenlicht.at
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: eeg-website
            port:
              number: 80
  - host: www.eeg-gruenlicht.at
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: eeg-website
            port:
              number: 80
  - host: xn--eeg-grnlicht-ilb.at
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: eeg-website
            port:
              number: 80
  - host: www.xn--eeg-grnlicht-ilb.at
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: eeg-website
            port:
              number: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: eeg-website-tls
  namespace: eeg-gruenlicht
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
spec:
  secretName: eeg-website-tls
  issuerRef:
    group: cert-manager.io
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - 'eeg-gruenlicht.at'
  - 'www.eeg-gruenlicht.at'
  - 'xn--eeg-grnlicht-ilb.at'
  - 'www.xn--eeg-grnlicht-ilb.at'
  privateKey:
    rotationPolicy: Always
